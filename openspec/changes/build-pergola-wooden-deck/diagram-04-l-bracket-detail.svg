<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><style>
    .title{font:700 28px Arial;fill:#1f2933}.label{font:17px Arial;fill:#1f2933}.small{font:14px Arial;fill:#1f2933}
    .wood{fill:#8b5e34;stroke:#4a2f18;stroke-width:2}.rubber{fill:#222}.concrete{fill:#bbb;stroke:#555;stroke-width:2}
    .angle{fill:#d9dee8;stroke:#344054;stroke-width:3}.screw{stroke:#111;stroke-width:4}.gravel{fill:#d0d5dd;stroke:#868e96;stroke-width:2}.geo{stroke:#2f9e44;stroke-width:5;stroke-dasharray:14 8}
  </style></defs>
  <rect width="1400" height="900" fill="#f8f9fa"/>
  <text x="55" y="55" class="title">04 - Detail maleho L-uhelniku</text>
  <text x="55" y="85" class="label">Uhelnik jen brani posunu. Svislou vahu nese obrubnik pres pryzovou podlozku.</text>

  <g transform="translate(150 145)">
    <rect x="310" y="50" width="90" height="280" class="wood"/><text x="430" y="115" class="label">hranol 45x70 na vysku</text>
    <rect x="290" y="330" width="130" height="16" class="rubber"/><text x="430" y="345" class="label">pryz/PVC 8 mm</text>
    <rect x="110" y="346" width="620" height="100" class="concrete"/><text x="760" y="405" class="label">obrubnik 1000x200x50 naplocho</text>
    <rect x="90" y="446" width="660" height="90" class="gravel"/><line x1="90" y1="536" x2="750" y2="536" class="geo"/>

    <!-- 40x40 bracket, one on each side. -->
    <path d="M270 290H310V346H250V326H270Z" class="angle"/>
    <path d="M400 290H440V326H460V346H400Z" class="angle"/>
    <line x1="275" y1="307" x2="310" y2="307" class="screw"/><line x1="275" y1="325" x2="310" y2="325" class="screw"/>
    <line x1="435" y1="307" x2="400" y2="307" class="screw"/><line x1="435" y1="325" x2="400" y2="325" class="screw"/>
    <line x1="265" y1="346" x2="265" y2="402" class="screw"/><line x1="445" y1="346" x2="445" y2="402" class="screw"/>

    <text x="110" y="620" class="label">Navrh spojeni</text>
    <text x="110" y="650" class="small">Uhelnik 40x40x40x2. Jeden na kazde strane vybraneho hranolu/segmentu.</text>
    <text x="110" y="675" class="small">Do betonu: Fischer DuoPower 5x25 + nerez A2 vrut 4x35. Jedna kotva na uhelnik.</text>
    <text x="110" y="700" class="small">Do dreva: dva nerez A2 vruty 4x35 na uhelnik. Protilehle vruty vyskově posunout.</text>
    <text x="110" y="725" class="small">Vrtat 5 mm bez priklepu, s dorazem 35-40 mm. Neprovrtat 50mm obrubnik.</text>
    <text x="110" y="750" class="small">Stred otvoru minimalne 50 mm od vsech hran betonu. Utahovat pomalu, bez razoveho utahovaku.</text>
    <text x="110" y="775" class="small">Jen 3 vnitrni rady: 36 uhelniku. Koupit 40. Do zatravnovacich dlazdic ani patek nevrtat.</text>
  </g>
</svg>
